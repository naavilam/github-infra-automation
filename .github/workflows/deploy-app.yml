name: Deploy (Apps -> Terraform Cloud) [multi-app]

on:
  push:
    branches: ["main"]
    paths:
      - "modules/github-dispatcher-app/**"
      - "workspaces/**"
      - ".github/workflows/deploy-app.yml"
      - ".github/scripts/**"

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        shell: bash
        run: |
          set -euo pipefail
          apps=(academic-codex high-energy quantum-computing quantum-materials)

          git fetch --no-tags --prune --depth=2 origin "${GITHUB_REF_NAME}"
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          changed="$(git diff --name-only "$base" "$head" || true)"

          if echo "$changed" | grep -qE '^modules/github-dispatcher-app/'; then
            selected=("${apps[@]}")
          else
            selected=()
            for a in "${apps[@]}"; do
              if echo "$changed" | grep -qE "^workspaces/${a}/"; then
                selected+=("$a")
              fi
            done
          fi

          if [ "${#selected[@]}" -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json='{"include":['
          first=1
          for a in "${selected[@]}"; do
            [ $first -eq 0 ] && json+=','
            first=0
            json+="{\"app\":\"$a\"}"
          done
          json+=']}'

          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "$json"

  deploy:
    needs: detect
    if: ${{ fromJson(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    environment: ${{ matrix.app }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TFC_ORG: ${{ vars.TFC_ORG }}

      # IMPORTANTÍSSIMO:
      # não dependa mais de vars.TFC_WORKSPACE; use o nome do app = workspace
      TFC_WORKSPACE: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Terraform Cloud - Apply app infra
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          bash .github/scripts/tfc-run.sh \
            --org "$TFC_ORG" \
            --workspace "$TFC_WORKSPACE" \
            --token "$TFC_TOKEN" \
            --auto-apply