name: Deploy Bootstrap (Terraform Cloud)

on:
  push:
    branches: ["main"]
    paths:
      - "modules/github-bootstrap/**"
      - ".github/workflows/deploy-bootstrap.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: deploy-bootstrap
  cancel-in-progress: true

jobs:
  deploy-bootstrap:
    runs-on: ubuntu-latest

    environment: github-bootstrap

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

      TFC_ORG: ${{ vars.TFC_ORG }}
      TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}

    steps:
      - uses: actions/checkout@v4

      - name: Guardrail (print targets)
        run: |
          set -euo pipefail
          echo "AWS_REGION=$AWS_REGION"
          echo "TFC_ORG=$TFC_ORG"
          echo "TFC_WORKSPACE=$TFC_WORKSPACE"

      - name: Terraform Cloud - Apply bootstrap infra
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
        run: |
          bash .github/scripts/tfc-run.sh \
            --org "$TFC_ORG" \
            --workspace "$TFC_WORKSPACE" \
            --token "$TFC_TOKEN" \
            --auto-apply