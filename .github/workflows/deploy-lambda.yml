name: Deploy Lambda Functions (AWS)

on:
  workflow_dispatch: {}
  push:
    paths:
      - "modules/github-lambda/**"
      - ".github/workflows/deploy-lambda.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lambda
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build lambda.zip
        run: |
          set -euo pipefail

          SRC="modules/github-lambda/dispatcher/lambda_function.py"
          test -f "$SRC" || (echo "missing $SRC" && exit 1)

          rm -rf build
          mkdir -p build/pkg

          docker run --rm \
            --entrypoint "" \
            -v "$PWD":/var/task \
            -w /var/task \
            public.ecr.aws/lambda/python:3.11 \
            bash -lc '
              python -m pip install --upgrade pip &&
              python -m pip install "PyJWT[crypto]" -t build/pkg
            '

          cp -v "$SRC" build/pkg/lambda_function.py
          (cd build/pkg && zip -qr ../lambda.zip .)

      - name: Update dispatcher Lambdas
        run: |
          set -euo pipefail

          FUNCTIONS=(
            academic-codex-dispatcher
            high-energy-dispatcher
            naavilam-dispatcher
            quantum-computing-dispatcher
            quantum-materials-dispatcher
          )

          for fn in "${FUNCTIONS[@]}"; do
            echo "Updating $fn"

            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file fileb://build/lambda.zip \
              --region "$AWS_REGION"
          done